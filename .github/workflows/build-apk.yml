name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ folder not in repo yet -> generate it (existing lib/ files are kept)
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.gonti --project-name gonti --platforms android .
            rm -f test/widget_test.dart
            sed -i 's/android:label="gonti"/android:label="গণতি"/' android/app/src/main/AndroidManifest.xml
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gonti-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk gonti.apk

      # Phone theke shohoje download korar jonno: Releases > latest > gonti.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gonti build ${{ github.run_number }}
          body: "Auto build from commit ${{ github.sha }}"
          make_latest: true
          files: gonti.apk
