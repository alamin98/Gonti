name: Build APK + Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ folder not in repo yet -> generate it (existing lib/ files are kept)
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.gonti --project-name gonti --platforms android,web .
            rm -f test/widget_test.dart
          fi

      - run: flutter pub get

      - name: App icon + native splash (from Figma logo)
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: App name + release signing
        env:
          GONTI_KEYSTORE_B64: ${{ secrets.GONTI_KEYSTORE_B64 }}
        run: python3 tool/ci_android_setup.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          GONTI_KEYSTORE_PASSWORD: ${{ secrets.GONTI_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gonti-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk gonti.apk

      # Phone theke shohoje download korar jonno: Releases > latest > gonti.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gonti build ${{ github.run_number }}
          body: "Auto build from commit ${{ github.sha }}"
          make_latest: true
          files: gonti.apk

  # Web app (iPhone/কম্পিউটার): https://alamin98.github.io/Gonti/
  # iPhone এ Safari তে খুলে Share → Add to Home Screen
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: |
          if [ ! -d web ]; then
            flutter create --org com.gonti --project-name gonti --platforms android,web .
            rm -f test/widget_test.dart
          fi

      - run: flutter pub get

      - name: SQLite for browser (sqlite3.wasm + worker)
        run: dart run sqflite_common_ffi_web:setup

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: PWA name, colors
        run: python3 tool/ci_web_setup.py

      - name: Build web
        run: flutter build web --release --base-href /Gonti/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4
