name: gonti
description: "গণতি — সহজ দৈনন্দিন হিসাব রাখার অ্যাপ (আয়, খরচ, দেনা-পাওনা, সঞ্চয়, বাজেট)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/
    - assets/images/
  fonts:
    - family: BalooDa2
      fonts:
        - asset: assets/fonts/BalooDa2.ttf

# অ্যাপ আইকন (Figma লোগো থেকে) — CI তে `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/launcher/icon.png
  adaptive_icon_background: "#2B59FF"
  adaptive_icon_foreground: assets/launcher/icon_fg.png
  min_sdk_android: 21

# অ্যাপ খোলার সাথে সাথে নীল স্ক্রিন (সাদা ফ্ল্যাশ যেন না হয়)
flutter_native_splash:
  color: "#2B59FF"
  image: assets/launcher/icon_fg.png
  android_12:
    color: "#2B59FF"
    image: assets/launcher/icon_fg.png
  ios: true
  web: false
